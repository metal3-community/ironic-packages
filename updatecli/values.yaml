openstack:
  # The single pin everything else derives from: the OpenStack
  # coordinated-release series to track (release-id from
  # https://releases.openstack.org).
  #
  # 'scripts/ironic-deps.py lock' turns this pin into requirements.lock:
  # pyproject.toml is regenerated with the services at their versions for
  # this series (openstack/releases deliverables) plus ironic's
  # driver-requirements.txt ranges, then resolved by 'uv pip compile' under
  # the series' upper-constraints.txt. The committed requirements.lock is the
  # version authority for every package below; updatecli reads it offline.
  #
  # Bump this value (e.g. to "2026.1") and re-run lock + sync to move the
  # whole package set to a new OpenStack release in one coordinated update.
  series: "2025.2"

  # Python version the lock is resolved for; keep it matching the python3
  # shipped by the target Alpine/Wolfi images (environment markers in
  # requirements can make the dependency set differ between Python versions).
  lockPython: "3.13"

  # OpenStack services/deliverables packaged here (py3-<name>.yaml).
  services:
    - ironic
    - ironic-python-agent
    - ironic-prometheus-exporter

  # Libraries packaged here at their requirements.lock versions
  # (py3-<name>.yaml). GENERATED — do not edit by hand: 'scripts/ironic-deps.py
  # sync' regenerates this list from requirements.lock, minus
  # externalPackages, driverLibraries and services.
  dependencies:
    - amqp
    - automaton
    - babel
    - construct
    - cotyledon
    - debtcollector
    - dogpile-cache
    - eventlet
    - flexcache
    - flexparser
    - futurist
    - ifaddr
    - iso8601
    - keystoneauth1
    - keystonemiddleware
    - kombu
    - microversion-parse
    - netaddr
    - openstacksdk
    - os-service-types
    - os-traits
    - oslo-cache
    - oslo-concurrency
    - oslo-config
    - oslo-context
    - oslo-db
    - oslo-i18n
    - oslo-log
    - oslo-messaging
    - oslo-metrics
    - oslo-middleware
    - oslo-policy
    - oslo-serialization
    - oslo-service
    - oslo-upgradecheck
    - oslo-utils
    - oslo-versionedobjects
    - osprofiler
    - paste
    - pastedeploy
    - pint
    - pycadf
    - pycdlib
    - pyghmi
    - python-keystoneclient
    - requestsexceptions
    - rfc3986
    - sushy
    - testresources
    - testscenarios
    - testtools
    - tooz
    - vine
    - voluptuous
    - yappi
    - zeroconf

  # Ironic driver libraries packaged here (py3-<name>.yaml, name == PyPI
  # name). Their lock versions are constrained by ironic's
  # driver-requirements.txt ranges instead of upper-constraints.
  driverLibraries:
    - proliantutils
    - python-scciclient
    - sushy-oem-idrac

  # Locked packages provided by the upstream Alpine/Wolfi repositories (or
  # the distro's python itself) rather than packaged here. Human-curated:
  # 'scripts/ironic-deps.py sync' treats any NEW requirements.lock member not
  # listed here as a package to scaffold and manage in this repo. To hand a
  # package over to the upstream distro, add it here and delete its
  # py3-<name>.yaml.
  externalPackages:
    - alembic
    - ansible
    - ansible-core
    - attrs
    - bcrypt
    - blinker
    - cachetools
    - certifi
    - cffi
    - charset-normalizer
    - cheroot
    - click
    - cryptography
    - decorator
    - defusedxml
    - dnspython
    - fasteners
    - flask
    - greenlet
    - idna
    - itsdangerous
    - jaraco-functools
    - jinja2
    - jmespath
    - jsonpatch
    - jsonpointer
    - jsonschema
    - jsonschema-specifications
    - jwcrypto
    - legacy-cgi
    - mako
    - markupsafe
    - more-itertools
    - msgpack
    - numpy
    - packaging
    - pbr
    - pecan
    - platformdirs
    - ply
    - prettytable
    - prometheus-client
    - psutil
    - pyasn1
    - pyasn1-modules
    - pycparser
    - pyjwt
    - pyopenssl
    - pyparsing
    - pysmi-lextudio
    - pysnmpcrypto
    - pysnmp-lextudio
    - python-dateutil
    - pyudev
    - pyyaml
    - redis
    - referencing
    - repoze-lru
    - requests
    - resolvelib
    - retrying
    - routes
    - rpds-py
    - setproctitle
    - setuptools
    - six
    - sqlalchemy
    - statsd
    - stevedore
