# yaml-language-server: $schema=https://github.com/chainguard-dev/melange/raw/refs/heads/main/pkg/config/schema.json
package:
  name: py3-oslo-messaging
  description: Oslo Messaging API
  version: 18.2.0
  epoch: 1
  copyright:
    - license: Apache-2.0
  dependencies:
    provider-priority: "0"
    runtime:
      - py3-amqp
      - py3-cachetools
      - py3-futurist
      - py3-kombu
      - py3-oslo-config
      - py3-oslo-context
      - py3-oslo-log
      - py3-oslo-metrics
      - py3-oslo-middleware
      - py3-oslo-serialization
      - py3-oslo-service
      - py3-oslo-utils
      - py3-pyyaml
      - py3-stevedore
      - py3-webob
  checks: {}
  cpe: {}

var-transforms:
  - from: ${{package.name}}
    match: ^py3-([a-z]).+$
    replace: $1
    to: prefix
  - from: ${{package.name}}
    match: ^py3-(.+)$
    replace: $1
    to: package
  - from: ${{vars.package}}
    match: "-"
    replace: "_"
    to: file
  - from: ${{vars.package}}
    match: "-"
    replace: "."
    to: import

environment:
  contents:
    packages:
      - busybox
      - wget
      - ca-certificates-bundle
      - python3
      - py3-pip

pipeline:
  - runs: |
      wget -T5 --tries=5 https://files.pythonhosted.org/packages/py3/${{vars.prefix}}/${{vars.package}}/${{vars.file}}-${{package.version}}-py3-none-any.whl
      pip install --no-deps --no-cache-dir --prefix=/usr --root=${{targets.destdir}} ${{vars.file}}-${{package.version}}-py3-none-any.whl

test:
  environment: {}
  pipeline:
    - uses: python/import
      with:
        imports: |
          import ${{vars.import}}

update:
  enabled: true

capabilities: {}
