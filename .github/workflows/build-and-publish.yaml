name: Build and Publish APK Repository
on:
  push:
    branches:
      - main
    paths:
      - '*.yaml'
      - '!.github/**'
      - 'pipelines/**'
      - 'recipes/**'
      - 'Makefile'
      - 'build*.env'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
    paths:
      - '*.yaml'
      - 'pipelines/**'
      - 'recipes/**'
      - 'Makefile'
      - 'build*.env'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild all packages'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
  pages: write
  id-token: write
  packages: write
env:
  MELANGE_VERSION: 0.30.6
  SIGNING_KEY_PATH: melange.rsa
# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  detect-changes:
    name: Detect Package Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: |
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' && github.event.action != 'closed') ||
       (github.event_name == 'pull_request' && github.event.action == 'closed' &&
        github.event.pull_request.merged == true &&
        (contains(github.event.pull_request.labels.*.name, 'package-update') ||
         contains(github.event.pull_request.labels.*.name, 'dependencies') ||
         contains(github.event.pull_request.labels.*.name, 'automated'))))
    outputs:
      packages: ${{ steps.check-force.outputs.force == 'true' && steps.all-packages.outputs.packages || steps.changes.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check force rebuild
        id: check-force
        run: |
          if [[ "${{ github.event.inputs.force_rebuild }}" == "true" || "${{ github.event_name }}" == "push" ||
                ("${{ github.event_name }}" == "pull_request" &&
                 "${{ github.event.action }}" == "closed" &&
                 "${{ github.event.pull_request.merged }}" == "true") ]]; then
            echo "force=true" >> $GITHUB_OUTPUT
            echo "Forcing rebuild due to: ${{ github.event_name }} / ${{ github.event.action }}"
          else
            echo "force=false" >> $GITHUB_OUTPUT
          fi
      - name: Get all packages
        id: all-packages
        run: |
          packages="$(ls {py3-*,ipmitool}.yaml | jq -R | jq -sc)"
          echo "packages=${packages}" >> $GITHUB_OUTPUT
      - name: Detect changed packages
        id: changes
        if: steps.check-force.outputs.force == 'false'
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.action }}" != "closed" ]]; then
            base_ref="${{ github.event.pull_request.base.sha }}"
          elif [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.action }}" == "closed" ]]; then
            # For merged PRs, check what was changed in the PR
            base_ref="${{ github.event.pull_request.base.sha }}"
            head_ref="${{ github.event.pull_request.head.sha }}"
          else
            base_ref="HEAD~1"
          fi

          if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.action }}" == "closed" ]]; then
            changed_files=$(git diff --name-only $base_ref $head_ref | grep -E '\.(yaml)$' || true)
          else
            changed_files=$(git diff --name-only $base_ref HEAD | grep -E '\.(yaml)$' || true)
          fi

          packages=()

          for file in $changed_files; do
            if [[ $file =~ ^py3-.*\.yaml$ ]]; then
              package="$file"
              packages+=("$package")
            fi
          done

          if [[ ${#packages[@]} -eq 0 ]]; then
            echo "packages=[]" >> $GITHUB_OUTPUT
          else
            printf -v joined '%s\n' "${packages[@]}"
            echo "$joined" | jq -R . | jq -s . > packages.json
            echo "packages=$(cat packages.json)" >> $GITHUB_OUTPUT
          fi
      # The signing key lives ONLY in the MELANGE_SIGNING_KEY repository
      # secret. It must never be pushed to the registry or the Pages site:
      # earlier revisions of this workflow published the private key to both
      # (ghcr :signing-keys artifact and /melange.rsa on Pages), so that key
      # is compromised and had to be rotated. Fail fast if the secret is
      # missing so later jobs don't half-publish.
      - name: Verify signing key secret
        env:
          MELANGE_SIGNING_KEY: ${{ secrets.MELANGE_SIGNING_KEY }}
        run: |
          if [[ -z "$MELANGE_SIGNING_KEY" ]]; then
            echo "::error::MELANGE_SIGNING_KEY secret is not set. Generate a keypair with 'melange keygen melange.rsa' and store the private key with: gh secret set MELANGE_SIGNING_KEY < melange.rsa"
            exit 1
          fi
  build-packages:
    name: Build APK Packages
    strategy:
      matrix:
        arch: [x86_64, aarch64]
        distro:
          - name: alpine
            repository: |
              https://dl-cdn.alpinelinux.org/alpine/edge/main
              https://dl-cdn.alpinelinux.org/alpine/edge/community
            keyring: |
              https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-4a6a0840.rsa.pub
              https://alpinelinux.org/keys/alpine-devel@lists.alpinelinux.org-616ae350.rsa.pub
          - name: wolfi
            repository: |
              https://packages.wolfi.dev/os
            keyring: https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
      fail-fast: false
    needs: detect-changes
    if: needs.detect-changes.outputs.packages != '[]'
    env:
      PACKAGES_TO_BUILD: ${{ needs.detect-changes.outputs.packages }}
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-22.04' }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup ORAS CLI
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
      - id: setup-melange-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/bin/melange
          key: melange-cache-${{ matrix.arch }}
      - name: Install melange
        if: steps.setup-melange-cache.outputs.cache-hit != 'true'
        env:
          IMG_ARCH: ${{ matrix.arch == 'aarch64' && 'arm64' || 'amd64' }}
        run: |
          curl -sL "https://github.com/chainguard-dev/melange/releases/download/v${{ env.MELANGE_VERSION }}/melange_${{ env.MELANGE_VERSION }}_linux_${IMG_ARCH}.tar.gz" \
          | tar xvz --strip-components=1
          sudo mv melange /usr/local/bin/
          chmod +x /usr/local/bin/melange
      - name: SignIn ORAS
        run: |
          oras login ghcr.io -u ${{ github.actor }} -p "${{ secrets.GITHUB_TOKEN }}"
      - name: Write signing key from secret
        env:
          MELANGE_SIGNING_KEY: ${{ secrets.MELANGE_SIGNING_KEY }}
        run: |
          printf '%s\n' "$MELANGE_SIGNING_KEY" > "${{ env.SIGNING_KEY_PATH }}"
          chmod 600 "${{ env.SIGNING_KEY_PATH }}"
          openssl rsa -in "${{ env.SIGNING_KEY_PATH }}" -pubout -out "${{ env.SIGNING_KEY_PATH }}.pub"
      - name: Sync existing packages from registry
        run: |
          mkdir -p packages/${{ matrix.distro.name }}/${{ matrix.arch }}

          # Try to pull existing packages for this distro/arch combination
          if oras pull --allow-path-traversal ghcr.io/${{ github.repository }}:${{ matrix.distro.name }}-${{ matrix.arch }} --output ${{ github.workspace }}/ 2>/dev/null; then
            echo "Synced existing packages from registry for ${{ matrix.distro.name }}-${{ matrix.arch }}"
          else
            echo "No existing packages found in registry for ${{ matrix.distro.name }}-${{ matrix.arch }}, starting fresh"
          fi
        continue-on-error: true
      # The synced APKINDEX may be signed by an older (historically rotated
      # and destroyed) key, which makes melange fail to verify the local
      # repository and silently broke every build. Regenerate and sign it
      # with the current key before building.
      - name: Re-sign local package index
        run: |
          dir="packages/${{ matrix.distro.name }}/${{ matrix.arch }}"
          rm -f "$dir/APKINDEX.tar.gz"
          if compgen -G "$dir/*.apk" > /dev/null; then
            (cd "$dir" && melange index \
              --signing-key "${GITHUB_WORKSPACE}/${{ env.SIGNING_KEY_PATH }}" \
              -o APKINDEX.tar.gz *.apk)
          fi
      - name: Ensure packages directory exists
        run: |
          mkdir -p workspace
          mkdir -p cache
          mkdir -p packages/${{ matrix.distro.name }}/${{ matrix.arch }}
      - name: Melange Build
        env:
          KEYRING: ${{ matrix.distro.keyring }}
          REPOSITORY: ${{ matrix.distro.repository }}
          CONFIGS: ${{ join(fromJSON(env.PACKAGES_TO_BUILD), ',') }}
        run: |
          repository_args="--repository-append ./packages/${{ matrix.distro.name }}"
          for repo in ${REPOSITORY}; do
            repository_args+=" --repository-append $repo"
          done
          keyring_args="--keyring-append ${{ env.SIGNING_KEY_PATH }}.pub"
          for key in ${KEYRING}; do
            keyring_args+=" --keyring-append $key"
          done
          for config in ${CONFIGS//,/ }; do
            melange build --arch ${{ matrix.arch }} \
              --namespace ${{ matrix.distro.name }} \
              --workspace-dir ./workspace \
              --cache-dir ./cache \
              --out-dir ./packages/${{ matrix.distro.name }} \
              --log-level info \
              --signing-key ${{ env.SIGNING_KEY_PATH }} \
              --runner docker \
              ${repository_args} \
              ${keyring_args} \
              "$config" || { echo "::error::melange build failed for $config"; echo "$config" >> melange-failures.txt; }
          done
      # Sign the final index (covering synced + newly built packages) with
      # the current key before pushing.
      - name: Sign package index
        run: |
          dir="packages/${{ matrix.distro.name }}/${{ matrix.arch }}"
          if compgen -G "$dir/*.apk" > /dev/null; then
            (cd "$dir" && melange index \
              --signing-key "${GITHUB_WORKSPACE}/${{ env.SIGNING_KEY_PATH }}" \
              -o APKINDEX.tar.gz *.apk)
          fi
      - name: Push packages to registry
        run: |
          # Build the ORAS push command with all APK files and APKINDEX
          push_args=()

          # Add APKINDEX.tar.gz if it exists
          if [[ -f "./packages/${{ matrix.distro.name }}/${{ matrix.arch }}/APKINDEX.tar.gz" ]]; then
            push_args+=("./packages/${{ matrix.distro.name }}/${{ matrix.arch }}/APKINDEX.tar.gz:application/vnd.${{ matrix.distro.name }}.apk.index.v1.tar+gzip")
          fi

          # Add all APK files
          while IFS= read -r -d '' apk_file; do
            push_args+=("${apk_file}:application/vnd.${{ matrix.distro.name }}.apk.package.v1+gzip")
          done < <(find "./packages/${{ matrix.distro.name }}/${{ matrix.arch }}" -name '*.apk' -print0)

          # Only push if we have files to push
          if [[ ${#push_args[@]} -gt 0 ]]; then
            echo "Pushing ${#push_args[@]} files to registry for ${{ matrix.distro.name }}-${{ matrix.arch }}"
            oras push "ghcr.io/${{ github.repository }}:${{ matrix.distro.name }}-${{ matrix.arch }}" "${push_args[@]}"
          else
            echo "No packages to push for ${{ matrix.distro.name }}-${{ matrix.arch }}"
          fi
      # Successful packages are pushed above; still fail the job so build
      # breakage is visible instead of silently republishing stale state.
      - name: Report build failures
        run: |
          if [[ -s melange-failures.txt ]]; then
            echo "::error::The following packages failed to build:"
            cat melange-failures.txt
            exit 1
          fi
  publish-repository:
    name: Publish APK Repository to GitHub Pages
    runs-on: ubuntu-latest
    needs: [detect-changes, build-packages]
    if: |
      github.repository == 'metal3-community/ironic-packages' &&
      (github.ref == 'refs/heads/main' ||
       (github.event_name == 'pull_request' &&
        github.event.action == 'closed' &&
        github.event.pull_request.merged == true &&
        github.event.pull_request.base.ref == 'main')) &&
      (needs.detect-changes.outputs.packages != '[]')
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup ORAS CLI
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
      - name: SignIn ORAS
        run: |
          oras login ghcr.io -u ${{ github.actor }} -p "${{ secrets.GITHUB_TOKEN }}"
      - name: Write signing key from secret
        env:
          MELANGE_SIGNING_KEY: ${{ secrets.MELANGE_SIGNING_KEY }}
        run: |
          printf '%s\n' "$MELANGE_SIGNING_KEY" > "${{ env.SIGNING_KEY_PATH }}"
          chmod 600 "${{ env.SIGNING_KEY_PATH }}"
          openssl rsa -in "${{ env.SIGNING_KEY_PATH }}" -pubout -out "${{ env.SIGNING_KEY_PATH }}.pub"
      - name: Pull all packages from registry
        run: |
          mkdir -p packages

          # Pull packages for each distro/arch combination
          for distro in alpine wolfi; do
            for target_arch in x86_64 aarch64; do
              echo "Pulling packages for ${distro}-${target_arch}..."
              mkdir -p "packages/${distro}/${target_arch}"

              if oras pull --allow-path-traversal "ghcr.io/${{ github.repository }}:${distro}-${target_arch}" --output "${{ github.workspace }}/" 2>/dev/null; then
                echo "Successfully pulled packages for ${distro}-${target_arch}"
              else
                echo "No packages found for ${distro}-${target_arch}, skipping"
              fi
            done
          done
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Organize repository structure
        run: |
          mkdir -p repository

          # The packages already contain the proper distro/arch structure
          # Just copy everything to the repository directory
          if [[ -d "packages" ]]; then
            cp -r packages/* repository/ || true
          fi

          # Ensure the directory structure exists even if some combinations are empty
          for distro in alpine wolfi; do
            for target_arch in x86_64 aarch64; do
              mkdir -p "repository/${distro}/${target_arch}"
            done
          done
      - name: Install melange
        run: |
          curl -sL "https://github.com/chainguard-dev/melange/releases/download/v${{ env.MELANGE_VERSION }}/melange_${{ env.MELANGE_VERSION }}_linux_amd64.tar.gz" \
          | tar xvz --strip-components=1
          sudo mv melange /usr/local/bin/
          chmod +x /usr/local/bin/melange
      - name: Re-sign package indexes
        run: |
          # Regenerate and sign every APKINDEX with the current key so the
          # published repository always verifies against the published public
          # key, regardless of which run originally built the packages.
          for distro in alpine wolfi; do
            for target_arch in x86_64 aarch64; do
              dir="repository/${distro}/${target_arch}"
              if compgen -G "$dir/*.apk" > /dev/null; then
                (cd "$dir" && melange index \
                  --signing-key "${GITHUB_WORKSPACE}/${{ env.SIGNING_KEY_PATH }}" \
                  -o APKINDEX.tar.gz *.apk)
                echo "Re-signed index for ${distro}/${target_arch}"
              fi
            done
          done
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Build site data from melange configs and APKINDEX
        run: |
          # Package metadata (description, license) comes from the melange
          # configs; availability (distro/arch/version) from the re-signed
          # APKINDEX files. The raw packages are linked into site/static.
          python3 -m pip install --quiet pyyaml
          python3 scripts/build-site-data.py \
            --configs-dir . \
            --repository-dir repository \
            --site-dir site \
            --pubkey "${{ env.SIGNING_KEY_PATH }}.pub" \
            --distros alpine,wolfi \
            --arches x86_64,aarch64
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install Tailwind CSS
        working-directory: site
        run: npm ci
      - name: Install Hugo
        env:
          HUGO_VERSION: 0.165.0
        run: |
          curl -sSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin hugo
          hugo version
      - name: Build site (Hugo + Tailwind CSS)
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --gc --minify --source site
      - name: Verify no private key in artifact
        run: |
          # Belt-and-braces: the private key must never reach the Pages site.
          if find repository -name '*.rsa' -o -name '*.pem' | grep -q .; then
            echo "::error::Private key material found in the Pages artifact:"
            find repository -name '*.rsa' -o -name '*.pem'
            exit 1
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: repository/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
