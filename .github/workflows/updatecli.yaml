name: Sync package versions from PyPI
on:
  schedule:
    # Run daily at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only print the diff, do not open a PR'
        required: false
        default: false
        type: boolean
permissions:
  contents: write
  pull-requests: write
jobs:
  sync:
    name: updatecli sync
    runs-on: ubuntu-latest
    if: github.repository == 'metal3-community/ironic-packages'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install updatecli
        uses: updatecli/updatecli-action@41b9c8d707830a9daebaeaa84c1b62d60b779564 # v3.6.0
        with:
          version: v0.120.1
      - name: Install prerequisites
        run: |
          python3 -c 'import yaml' 2>/dev/null \
            || python3 -m pip install --user pyyaml \
            || python3 -m pip install --user --break-system-packages pyyaml
      - name: Generate updatecli manifest from the melange configs
        run: python3 scripts/gen-updatecli.py
      - name: updatecli diff
        if: github.event.inputs.dry_run == 'true'
        run: updatecli diff --config updatecli/updatecli.d
      - name: updatecli apply
        if: github.event.inputs.dry_run != 'true'
        run: updatecli apply --config updatecli/updatecli.d
      - name: Create Pull Request
        if: github.event.inputs.dry_run != 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update package versions from PyPI"
          title: "chore: update package versions from PyPI"
          body: |
            ## Package version updates

            updatecli bumped each `py3-*.yaml` to the latest release of its
            corresponding PyPI project. The manifest
            (`updatecli/updatecli.d/pypi.yaml`) is generated from the melange
            configs by `scripts/gen-updatecli.py`; each source is a `pypi`
            kind keyed by the config filename, and each target rewrites
            `package.version`.

            > **Note:** review version bumps before merging — PyPI "latest"
            > does not guarantee that co-installed OpenStack packages remain
            > mutually compatible.

            ---
            *This PR was created automatically by the updatecli workflow.*
          branch: update/pypi-versions
          delete-branch: true
          labels: |
            automated
            package-update
